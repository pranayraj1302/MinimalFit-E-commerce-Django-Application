<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catalogue</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/swiper/swiper-bundle.min.css" />

    <style>
        /* Login Button Styles */
        .login-button {
            outline: none;
            cursor: pointer;
            border: none;
            padding: 0.9rem 2rem;
            font-family: inherit;
            font-size: 17px;
            position: relative;
            display: inline-block;
            font-weight: 700;
            border-radius: 50px;
            overflow: hidden;
            background: linear-gradient(90deg, #ff8c00, #ff0080);
            color: white;
            transition: all 0.4s ease-in-out;
        }

        .login-button:hover {
            background: linear-gradient(90deg, #ff0080, #ff8c00);
            transform: scale(1.05);
        }
    </style>
</head>
<body class="bg-white text-gray-900">

    <!-- Navbar -->
    <nav class="fixed top-0 left-0 w-full bg-white shadow-md px-6 py-4 flex justify-between items-center z-50">
        <h1 class="text-2xl font-bold">Minimal Fit</h1>
        <div class="hidden md:flex gap-8 items-center">
            <a href="/" class="hover:underline">Home</a>
            <a href="{% url 'catalogue' %}" class="hover:underline">Catalogue</a>
            <a href="{% url 'about' %}" class="hover:underline">About</a>
            <a href="{% url 'contact' %}" class="hover:underline">Contact</a>
        </div>
        <!-- Updated Login Button -->
        <button class="login-button"><span>Login</span></button>
    </nav>

    <!-- Main Content -->
    <main class="pt-16 pb-10">
        <div class="container mx-auto px-4">
            <h1 class="text-3xl font-bold text-center my-8">Catalogue Page</h1>
            <p class="text-center mb-12">Explore our latest products below:</p>

            <!-- Product Listings -->
            <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-8">
                {% for product in products %}
                <div class="bg-white p-4 rounded-lg shadow-md flex flex-col items-center transition-transform transform hover:scale-105">
                    <img src="{{ product.image.url }}" alt="{{ product.name }}" class="w-full h-48 object-cover rounded mb-4">
                    <h3 class="text-xl font-semibold">{{ product.name }}</h3>
                    <p class="text-gray-600">{{ product.description }}</p>
                    <p class="text-lg font-bold mt-2">${{ product.price }}</p>
                    <a href="{% url 'product_detail' product.id %}" class="login-button mt-4"><span>View Details</span></a>
                </div>
                {% empty %}
                <p class="text-center col-span-full">No products available.</p>
                {% endfor %}
            </div>
        </div>
    </main>

    <footer class="text-center py-4">
        <p>© 2025 MinimalFit</p>
    </footer>
</body>
</html>
