{% extends 'store/base.html' %}

{% block content %}
<div class="max-w-6xl mx-auto p-6 bg-white rounded-lg shadow-lg">
    <div class="flex flex-col md:flex-row">
        <!-- Product Image -->
        <div class="md:w-1/2 mb-6 md:mb-0">
            <img src="{{ product.image.url }}" alt="{{ product.name }}" class="w-full h-auto rounded-lg shadow-md transition-transform transform hover:scale-105 duration-300 ease-in-out">
        </div>

        <!-- Product Information -->
        <div class="md:w-1/2 md:pl-6">
            <h1 class="text-4xl font-bold text-gray-800 mb-2">{{ product.name }}</h1>
            <p class="text-2xl text-green-600 mb-4"><strong>Price:</strong> ${{ product.price|floatformat:2 }}</p>
            <p class="text-gray-700 mb-6">{{ product.description }}</p>

            <!-- Quantity and Add to Cart Button -->
            <form method="post" action="{% url 'add_to_cart' product.id %}" id="add-to-cart-form">
                {% csrf_token %}
                <div class="mb-4">
                    <label for="quantity" class="block text-gray-700 font-medium mb-2">Quantity:</label>
                    <input type="number" id="quantity" name="quantity" value="1" min="1" class="border border-gray-300 rounded-md p-2 w-24 focus:outline-none focus:ring-2 focus:ring-blue-500" required>
                </div>
                <button type="submit" class="w-full bg-blue-500 text-white font-bold py-2 px-4 rounded transition duration-200 ease-in-out transform hover:scale-105 hover:bg-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-opacity-50">
                    Add to Cart
                </button>
            </form>

            <!-- Customer Reviews Section -->
            <div class="mt-6">
                <h2 class="text-xl font-semibold mb-2">Customer Reviews</h2>
                <div class="bg-gray-100 p-4 rounded-lg shadow-inner mb-4">
                    <p class="text-gray-700">"Great product! Highly recommend it!"</p>
                    <p class="text-gray-500 text-sm">- Jane Doe</p>
                </div>
                <div class="bg-gray-100 p-4 rounded-lg shadow-inner">
                    <p class="text-gray-700">"Quality is excellent, will buy again."</p>
                    <p class="text-gray-500 text-sm">- John Smith</p>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- JavaScript for optional interactivity -->
<script>
    document.getElementById('add-to-cart-form').addEventListener('submit', function(e) {
        const quantityInput = document.getElementById('quantity');
        if (quantityInput.value <= 0) {
            e.preventDefault();
            alert('Please select a valid quantity.');
        } else {
            alert('Product added to cart successfully!');
        }
    });
</script>

{% endblock %}
