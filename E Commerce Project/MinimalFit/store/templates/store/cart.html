<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimal Fit - Cart</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-900">

    <!-- Navbar -->
    <nav class="bg-white shadow-md p-4 flex justify-between items-center">
        <h1 class="text-2xl font-bold">Minimal Fit</h1>
        <div class="flex gap-6">
            <input type="text" placeholder="Search..." class="border p-2 rounded-lg">
            <button class="text-lg">🛒 Cart</button>
        </div>
    </nav>

    <!-- Cart Section -->
    <section class="p-10 max-w-4xl mx-auto bg-white rounded-lg shadow-md">
        <h2 class="text-3xl font-bold mb-6">Shopping Cart</h2>

        <!-- Cart Items -->
        <div class="space-y-6">
            <div class="flex items-center justify-between border-b pb-4">
                <img src="https://via.placeholder.com/80" alt="Product Image" class="w-20 h-20 rounded-lg">
                <div class="flex-1 ml-4">
                    <h3 class="text-xl font-semibold">Minimalist T-Shirt</h3>
                    <p class="text-gray-600">Size: M | Color: Black</p>
                    <p class="text-lg font-bold mt-2">$30.00</p>
                </div>
                <input type="number" value="1" class="w-16 border text-center p-2 rounded-lg">
                <button class="text-red-600 font-bold ml-4">Remove</button>
            </div>
        </div>

        <!-- Cart Summary -->
        <div class="mt-6 border-t pt-4">
            <h3 class="text-xl font-semibold">Total: <span class="font-bold">$30.00</span></h3>
            <button class="mt-4 w-full bg-black text-white py-3 rounded-lg text-lg">Proceed to Checkout</button>
        </div>
    </section>

</body>
</html>
