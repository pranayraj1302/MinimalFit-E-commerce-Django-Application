<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimal Fit - Checkout</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-900">

    <!-- Navbar -->
    <nav class="bg-white shadow-md p-4 flex justify-between items-center">
        <h1 class="text-2xl font-bold">Minimal Fit</h1>
        <div class="flex gap-6">
            <button class="text-lg">🛒 Cart</button>
        </div>
    </nav>

    <!-- Checkout Section -->
    <section class="p-10 max-w-4xl mx-auto bg-white rounded-lg shadow-md">
        <h2 class="text-3xl font-bold mb-6">Checkout</h2>

        <!-- Billing Details -->
        <form class="space-y-6">
            <div>
                <label class="block font-semibold">Full Name</label>
                <input type="text" class="w-full border p-2 rounded-lg" placeholder="John Doe" required>
            </div>

            <div>
                <label class="block font-semibold">Email</label>
                <input type="email" class="w-full border p-2 rounded-lg" placeholder="johndoe@example.com" required>
            </div>

            <div>
                <label class="block font-semibold">Shipping Address</label>
                <input type="text" class="w-full border p-2 rounded-lg" placeholder="123 Street, City, Country" required>
            </div>

            <div>
                <label class="block font-semibold">Payment Method</label>
                <select class="w-full border p-2 rounded-lg">
                    <option>Credit Card</option>
                    <option>PayPal</option>
                    <option>Bank Transfer</option>
                </select>
            </div>

            <!-- Order Summary -->
            <div class="mt-6 border-t pt-4">
                <h3 class="text-xl font-semibold">Order Summary</h3>
                <p class="mt-2">Minimalist T-Shirt x1 - <span class="font-bold">$30.00</span></p>
                <h3 class="text-lg font-semibold mt-2">Total: <span class="font-bold">$30.00</span></h3>
            </div>

            <button class="mt-4 w-full bg-black text-white py-3 rounded-lg text-lg">Complete Purchase</button>
        </form>
    </section>

</body>
</html>
